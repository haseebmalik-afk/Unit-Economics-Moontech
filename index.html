<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moontech · Unit Economics 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  /* base — warm neutral, clean & bright */
  --bg:#F7F7F6; --bg-2:#F0F0EE; --card:#FFFFFF;
  --border:#E7E6E3; --border-soft:#EFEEEC; --hairline:#EFEEEC;
  --ink:#12131A; --text:#26272E; --text-2:#5E5F68; --text-3:#8E8F98; --text-4:#B0B1B8;
  /* signature — refined indigo */
  --accent:#4F46E5; --accent-600:#4338CA; --accent-700:#3730A3;
  --accent-soft:#EAE9FC; --accent-tint:#C2BEF3; --accent-wash:#F5F4FF;
  /* semantic — sign only */
  --good:#0E9F6E; --good-deep:#057A55; --good-bg:#E5F5EE;
  --bad:#DC2F44; --bad-deep:#B4223A; --bad-bg:#FBE9EC;
  --warn:#C77A0F; --warn-bg:#FCF1DE;
  --neutral-chip:#F0F0EE;
  /* sidebar — flat, warm-dark */
  --side-1:#17161C; --side-2:#111015; --side-text:#8A8B95; --side-dim:#5D5E67;
  --grid:#F0F0EE; --radius:12px; --radius-sm:9px;
  /* flat depth — hairline borders carry the cards */
  --shadow-sm:0 1px 2px rgba(18,19,26,.04);
  --shadow-md:0 1px 3px rgba(18,19,26,.06);
  --shadow-lg:0 4px 16px -4px rgba(18,19,26,.10);
  /* back-compat aliases */
  --indigo:#4F46E5; --indigo-600:#4338CA; --indigo-700:#3730A3;
  --indigo-soft:#EAE9FC; --indigo-tint:#C2BEF3; --indigo-wash:#F5F4FF;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
.num,td.num,.kpi-value,.lever input,table,.stat{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1,"cv01" 1}
.layout{display:flex; min-height:100vh}

/* ---------- sidebar ---------- */
.sidebar{width:198px; min-width:198px; background:var(--side-1);
  color:var(--side-text); position:sticky; top:0; height:100vh; display:flex; flex-direction:column;
  padding:22px 0 16px; box-shadow:inset -1px 0 0 rgba(255,255,255,.04), 6px 0 24px -14px rgba(20,24,33,.5); z-index:5}
.brand{display:flex; flex-direction:column; align-items:flex-start; gap:7px; padding:2px 20px 18px; margin-bottom:12px;
  border-bottom:1px solid rgba(255,255,255,.07)}
.brand-logo{height:30px; width:auto; display:block}
.brand .mark{width:32px; height:32px; border-radius:9px; background:linear-gradient(140deg,#6D63FF,#4F46E5);
  display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px -2px rgba(79,70,229,.5), inset 0 1px 0 rgba(255,255,255,.25); flex-shrink:0}
.brand .mark svg{width:19px; height:19px; display:block}
.brand .word{font-weight:700; letter-spacing:.02em; color:#fff; font-size:15px; line-height:1.1}
.brand .sub{font-size:11px; color:var(--side-text); margin-top:2px; letter-spacing:.01em}
.nav{flex:1; overflow-y:auto; padding-top:4px}
.nav a{display:flex; align-items:center; gap:10px; padding:9px 20px; color:var(--side-text); text-decoration:none;
  font-size:13.5px; font-weight:500; border-left:2.5px solid transparent; cursor:pointer; transition:color .15s, background .15s}
.nav a:hover{color:#D9DEE7; background:rgba(255,255,255,.03)}
.nav a.active{color:#fff; border-left-color:var(--indigo); background:linear-gradient(90deg,rgba(79,70,229,.20),rgba(79,70,229,.02)); font-weight:600}
.nav .group{padding:18px 20px 7px; font-size:10.5px; letter-spacing:.14em; color:#586173; text-transform:uppercase; font-weight:600}
.side-foot{padding:14px 20px 0; font-size:11px; color:#5B6474; border-top:1px solid rgba(255,255,255,.07); line-height:1.6}
.side-foot b{color:#B9C0CC; font-weight:600}

/* ---------- content: readable-fluid ---------- */
.content{flex:1; padding:30px clamp(24px,3.2vw,56px) 72px; width:100%; max-width:1720px; margin:0 auto}
.page{display:none}
.page.active{display:block; animation:fade .32s ease}
@keyframes fade{from{opacity:0} to{opacity:1}}
h1{font-size:23px; font-weight:700; letter-spacing:-.02em; color:var(--ink)}
.page-sub{color:var(--text-2); font-size:13.5px; margin-top:6px; max-width:74ch; line-height:1.6}
.page-head{margin-bottom:22px}
h2{font-size:15.5px; font-weight:650; letter-spacing:-.01em; margin-bottom:2px; color:var(--ink)}
.card-sub{color:var(--text-3); font-size:12px; margin-bottom:14px; line-height:1.55; max-width:80ch}

/* fluid grid — columns grow, not stretch to infinity */
.grid{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:16px}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 20px; box-shadow:none}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-6{grid-column:span 6}
.span-4{grid-column:span 4}.span-3{grid-column:span 3}
@media(max-width:1180px){.span-8{grid-column:span 12}.span-4{grid-column:span 6}.span-3{grid-column:span 6}}
@media(max-width:820px){.span-6,.span-4,.span-3{grid-column:span 12}}

/* KPI tiles — hairline accent + display number */
.kpi{position:relative; overflow:hidden}
.kpi::before{content:""; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,var(--indigo),var(--indigo-tint)); opacity:.9}
.kpi.kpi-plain::before{background:linear-gradient(90deg,var(--text-3),var(--border))}
.kpi-label{font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--text-3);
  display:flex; align-items:center; gap:7px}
.kpi-value{font-family:inherit; font-size:29px; font-weight:800; margin-top:7px;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em; color:var(--ink); line-height:1.05}
.kpi-note{font-size:11.5px; color:var(--text-2); margin-top:5px}
.kpi-spark{height:36px; margin-top:10px; margin-left:-2px; margin-right:-2px}
.delta-good{color:var(--good-deep)} .delta-bad{color:var(--bad-deep)}

.tag{display:inline-block; font-size:10px; font-weight:600; color:var(--text-3); background:var(--neutral-chip);
  border-radius:5px; padding:2px 6px; letter-spacing:.02em; vertical-align:1px}

/* chips */
.chip{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; white-space:nowrap; line-height:1.3}
.chip-good{background:var(--good-bg); color:var(--good-deep)}
.chip-bad{background:var(--bad-bg); color:var(--bad-deep)}
.chip-warn{background:var(--warn-bg); color:var(--warn)}
.chip-neutral{background:var(--neutral-chip); color:var(--text-2)}
.chip-accent{background:var(--indigo-soft); color:var(--indigo-600)}

/* tables */
table{width:100%; border-collapse:collapse; font-size:12.5px}
th{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3); font-weight:600;
  text-align:right; padding:8px 9px; border-bottom:1.5px solid var(--border)}
th.txt,td.txt{text-align:left}
td{padding:8px 9px; border-bottom:1px solid var(--border-soft); text-align:right; color:var(--text)}
tbody tr:last-child td{border-bottom:none}
tr.total td{font-weight:700; border-top:2px solid var(--border); color:var(--ink)}
tr.var-row td{font-size:11px; padding-top:4px; padding-bottom:9px; border-bottom:1.5px solid var(--border)}
tr.var-row td.txt{color:var(--text-3); font-weight:600; text-transform:uppercase; letter-spacing:.04em; font-size:10px}
.muted{color:var(--text-4)}
.table-wrap{overflow-x:auto; border-radius:var(--radius-sm)}

/* ---------- CLIENT LADDER — the showpiece ---------- */
.ladder{width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px}
.ladder th{position:sticky; top:0; background:var(--card); z-index:1; padding:9px 8px; white-space:nowrap}
.ladder td{padding:0 8px; height:46px; border-bottom:1px solid var(--hairline); vertical-align:middle}
.ladder tbody tr{transition:background .12s}
.ladder tbody tr:hover{background:var(--indigo-wash)}
.ladder .cwrap{display:flex; align-items:center; gap:11px}
.avatar{width:30px; height:30px; border-radius:8px; flex-shrink:0; color:#fff; font-size:11px; font-weight:700;
  display:inline-flex; align-items:center; justify-content:center; letter-spacing:.01em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18), 0 1px 2px rgba(20,24,33,.15)}
.ladder .cname{font-weight:600; color:var(--ink); font-size:13px; line-height:1.2}
.ladder .cstart{font-size:10.5px; color:var(--text-4); font-variant-numeric:tabular-nums}
/* level badge */
.lvl{display:inline-flex; align-items:center; justify-content:center; width:30px; height:24px; border-radius:7px;
  font-weight:700; font-size:11.5px; letter-spacing:.01em; box-shadow:inset 0 0 0 1px rgba(20,24,33,.04)}
.lvl0{background:#F1F3F7; color:#A9B1BF}
.lvl1{background:#EDEBFB; color:#8983D6}
.lvl2{background:#DEDBF9; color:#6C63E0}
.lvl3{background:#C9C5F4; color:#4338CA}
.lvl4{background:#8B83EC; color:#fff}
.lvl5{background:linear-gradient(135deg,#5B52E8,#4338CA); color:#fff; box-shadow:0 2px 6px -1px rgba(79,70,229,.45)}
/* step arrows */
.step{font-size:11px; color:var(--text-3); font-variant-numeric:tabular-nums}
.step.none{color:var(--text-4)}
/* uniform spend chip — same size, color = tier; empty months stay blank so the grid reads calm */
.spend-cell{padding:5px 4px !important; text-align:center}
.schip{display:inline-block; min-width:52px; padding:4px 0; border-radius:6px; font-size:11px; font-weight:600;
  font-variant-numeric:tabular-nums; text-align:center; line-height:1.2}
.schip.t1{background:#EEEDFB; color:#7B75D0}
.schip.t2{background:#DFDDF8; color:#5F57DA}
.schip.t3{background:#C7C3F3; color:#4338CA}
.schip.t4{background:#8B83EC; color:#fff}
.schip.t5{background:linear-gradient(135deg,#5B52E8,#4338CA); color:#fff; box-shadow:0 1px 4px -1px rgba(79,70,229,.45)}
/* total spend emphasis */
.ladder .tot{font-weight:700; color:var(--ink)}
.ladder .arpa-big{font-weight:700; color:var(--indigo-600)}

/* status pill with dot */
.st{display:inline-flex; align-items:center; gap:6px; padding:3px 9px 3px 8px; border-radius:16px; font-size:11px; font-weight:600; white-space:nowrap}
.st .dot{width:6px; height:6px; border-radius:50%; flex-shrink:0}
.st-active{background:var(--good-bg); color:var(--good-deep)} .st-active .dot{background:var(--good)}
.st-scaling{background:var(--indigo-soft); color:var(--indigo-600)} .st-scaling .dot{background:var(--indigo)}
.st-low{background:var(--warn-bg); color:var(--warn)} .st-low .dot{background:var(--warn)}
.st-watch{background:var(--warn-bg); color:var(--warn)} .st-watch .dot{background:#E0A030}
.st-early{background:var(--neutral-chip); color:var(--text-2)} .st-early .dot{background:var(--text-3)}
.st-risk{background:var(--bad-bg); color:var(--bad-deep)} .st-risk .dot{background:var(--bad)}
.st-inactive{background:#EEF0F4; color:#8A94A6} .st-inactive .dot{background:#B2BAC7}

/* levers */
.lever{margin-bottom:15px}
.lever label{display:block; font-size:12.5px; font-weight:600; margin-bottom:5px; color:var(--text)}
.lever .hint{font-size:11px; color:var(--text-3); font-weight:400; margin-left:4px}
.lever input{width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius-sm);
  font-size:14px; font-weight:600; font-family:inherit; color:var(--ink); background:#fff; transition:border .15s, box-shadow .15s}
.lever input:focus{outline:none; border-color:var(--indigo); box-shadow:0 0 0 3px var(--indigo-soft)}
.locked{background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 12px;
  font-size:12.5px; color:var(--text-2); display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px}
.locked b{color:var(--ink)}
.live-heading{font-size:15px; font-weight:550; background:linear-gradient(120deg,var(--indigo-wash),var(--indigo-soft));
  border:1px solid var(--indigo-tint); color:var(--indigo-700); border-radius:var(--radius);
  padding:15px 18px; margin-bottom:20px; line-height:1.65}
.live-heading .v{color:var(--indigo-600); font-weight:700}

/* scenarios */
.scen-banner{font-size:14px; font-weight:600; padding:13px 18px; border-radius:var(--radius); margin-bottom:16px}
.scen-banner.ok{background:var(--good-bg); color:var(--good-deep)}
.scen-banner.warn{background:var(--warn-bg); color:var(--warn)}
.scen-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:14px}
.scen-card{border:1px solid var(--border); border-radius:var(--radius); padding:16px 17px; position:relative;
  background:var(--card); box-shadow:none; transition:border-color .15s}
.scen-card:hover{border-color:var(--accent-tint)}
.scen-card.hit{border-color:#A6E0C3; background:linear-gradient(180deg,#F6FCF9,#fff)}
.scen-card h3{font-size:14px; font-weight:700; margin-bottom:8px; color:var(--ink)}
.scen-card .assum{font-size:11.5px; color:var(--text-2); margin:10px 0; line-height:1.55}
.scen-out{font-size:12.5px; display:flex; justify-content:space-between; align-items:center; padding:4px 0}
.scen-out b{font-weight:700; color:var(--ink)}
.apply-btn{margin-top:12px; width:100%; padding:8px; border:1px solid var(--border); background:#fff; border-radius:var(--radius-sm);
  font-family:inherit; font-size:12px; font-weight:600; color:var(--text-2); cursor:pointer; transition:all .15s}
.apply-btn:hover{border-color:var(--indigo); color:var(--indigo-600); background:var(--indigo-wash)}

/* misc */
.chart-box{position:relative; width:100%}
.legend-note{font-size:11px; color:var(--text-3); margin-top:10px; line-height:1.5}
.callout{border-left:3px solid var(--indigo); background:var(--indigo-wash); padding:11px 15px; border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  font-size:12.5px; color:var(--indigo-700); margin:10px 0; line-height:1.55}
.callout.warn{border-left-color:var(--warn); background:var(--warn-bg); color:#7A5310}
.method p{font-size:13.5px; color:var(--text-2); margin-bottom:11px; max-width:76ch; line-height:1.65}
.method h2{margin-top:22px}
.method ul{margin:0 0 12px 20px; font-size:13.5px; color:var(--text-2)}
.method li{margin-bottom:6px; line-height:1.6}
.footer-note{margin-top:28px; font-size:11px; color:var(--text-3)}
.health-tile{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:10px; background:var(--card)}
.health-tile .h-l{font-size:12.5px; font-weight:600; color:var(--text)}
.health-tile .h-n{font-size:10.5px; color:var(--text-3); margin-top:2px}
.health-tile .h-v{font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

/* live-data chrome */
.load-banner{background:var(--accent-wash); border:1px solid var(--accent-tint); color:var(--accent-700); border-radius:var(--radius-sm);
  padding:10px 14px; font-size:12.5px; font-weight:500; margin-bottom:16px}
.seg{display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:#fff}
.seg button{border:0; background:transparent; font-family:inherit; font-size:11.5px; font-weight:600; color:var(--text-2); padding:6px 11px; cursor:pointer}
.seg button.on{background:var(--accent); color:#fff}
.drop-btn{border:1px solid var(--border); background:#fff; border-radius:6px; font-family:inherit; font-size:10.5px; font-weight:600;
  color:var(--text-2); padding:3px 8px; cursor:pointer; white-space:nowrap}
.drop-btn:hover:not([disabled]){border-color:var(--bad); color:var(--bad-deep)}
.drop-btn[disabled]{opacity:.45; cursor:not-allowed}
.ladder tbody tr.dropped-row td{opacity:.55}
.ladder tbody tr.dropped-row td:last-child{opacity:1}
.lvl0{background:#F1F3F7; color:#A9B1BF}
</style>
</head>

<script>
/* ============================================================
   LIVE DATA LAYER
   Fetches the three published model tabs (Cockpit, Calculations,
   Top Clients) as CSV and maps them into the DATA object the
   dashboard renders from. CAC actuals + target both come from
   the Cockpit tab's section 9 for now (a dedicated CAC sheet can
   be swapped in later by changing SOURCES.cac).
   ============================================================ */
"use strict";

const SOURCES = {
  cockpit:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTujtpMU-nFDgWbHpJ3JX4Fv5HmQpKlioUQClOMXaaWhFiDyFQMSJdcyHLDCLnYO6Cw_t8qPpiShhSn/pub?gid=1971085519&single=true&output=csv",
  topClients: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTujtpMU-nFDgWbHpJ3JX4Fv5HmQpKlioUQClOMXaaWhFiDyFQMSJdcyHLDCLnYO6Cw_t8qPpiShhSn/pub?gid=264907211&single=true&output=csv",
  calc:     "https://docs.google.com/spreadsheets/d/e/2PACX-1vTujtpMU-nFDgWbHpJ3JX4Fv5HmQpKlioUQClOMXaaWhFiDyFQMSJdcyHLDCLnYO6Cw_t8qPpiShhSn/pub?gid=78154279&single=true&output=csv"
};

/* ---------- CSV parse (handles quoted fields with commas) ---------- */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if (field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}

/* ---------- value cleaners ---------- */
function num(s){
  if (s === null || s === undefined) return null;
  s = String(s).trim();
  if (s === '' || s === '-' || s === 'N/A' || s === 'n/a') return null;
  const neg = /^\(.*\)$/.test(s);
  s = s.replace(/[$,%()]/g, '').replace(/x/gi, '').replace(/months?/gi, '').trim();
  if (s === '' || s === '-') return null;
  const v = parseFloat(s);
  if (isNaN(v)) return null;
  return neg ? -v : v;
}
function pct(s){ const v = num(s); return v === null ? null : v / 100; }  // "20%" -> 0.20

/* ---------- row lookup by first-cell label (case/space-insensitive) ---------- */
function makeSheet(rows){
  const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
  return {
    rows,
    // find the first row whose col-0 label matches
    find(label){
      const t = norm(label);
      return rows.find(r => r.length && norm(r[0]) === t) || null;
    },
    // 12 monthly cells (cols D..O = indices 3..14) for a labelled row
    months(label, cast = num){
      const r = this.find(label);
      if (!r) return null;
      const out = [];
      for (let i = 3; i <= 14; i++) out.push(i < r.length ? cast(r[i]) : null);
      return out;
    },
    // the Full-Year / summary cell (col B = index 1)
    fy(label, cast = num){
      const r = this.find(label);
      return r ? (1 < r.length ? cast(r[1]) : null) : null;
    },
    // raw cell text
    cell(label, colIdx = 1){
      const r = this.find(label);
      return r && colIdx < r.length ? r[colIdx] : null;
    },
    // find a row whose col-1 label matches (used for the unit-econ summary block), return col-0 value
    byLabelCol1(label, cast = num){
      const t = norm(label);
      const r = rows.find(x => x.length > 1 && norm(x[1]) === t);
      return r ? cast(r[0]) : null;
    }
  };
}

/* ---------- fetch one CSV ---------- */
async function fetchSheet(url){
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  return makeSheet(parseCSV(text));
}

/* The published CSV carries seasonality only as displayed (e.g. 7.6% for 0.0763). That
   rounding alone moves a re-computed year-end ARR by ~$10K. So we pick the most precise
   source available, in this order:
   1. the CSV itself, when its cells are formatted to 2+ decimals (then it is exact);
   2. back-solved from the sheet's own "New client revenue" row, which is a linear function
      of seasonality (recovers ~4-decimal precision, within $1/month of the sheet's plan);
   3. the Cockpit "Target ARPA Annual" monthly row ÷ ARPA;
   4. the rounded CSV values. */
function resolveSeasonality(ca, ck, d){
  const csv = ca.months('Seasonality weight (%)', pct);
  const valid = a => Array.isArray(a) && a.length === 12 && a.every(v => v != null && v > 0 && v < 1) && Math.abs(a.reduce((x,y)=>x+y,0) - 1) < 0.02;
  const finer = valid(csv) && csv.some(v => Math.abs(v*1000 - Math.round(v*1000)) > 1e-9);   // more than 0.1% precision present
  if (finer) return { values: csv, source: 'sheet cells (exact)' };
  const L = d.defaults, dist = d.distribution, nr = d.newClientRevPlan;
  if (valid(dist) && Array.isArray(nr) && L.arpa && L.newClients != null && L.dropout != null){
    const sg = dist.map(x => Math.round(x * L.newClients)); const cum = []; sg.reduce((a,b,i)=>(cum[i]=a+b,cum[i]),0);
    const derived = nr.map((v,m) => { if (v == null) return null; const mat = m>=3 ? cum[m-3] : 0; const ramp = sg[m]+(sg[m-1]||0)+(sg[m-2]||0); const div = mat + ramp*(1-L.dropout); return div > 0 ? v/div/L.arpa : null; });
    if (valid(derived)) return { values: derived, source: 'back-solved from the sheet\'s new-client revenue row' };
  }
  const sa = ck.months('Target ARPA Annual ($)');
  if (Array.isArray(sa) && L.arpa){ const fromRow = sa.map(v => v == null ? null : v / L.arpa); if (valid(fromRow)) return { values: fromRow, source: 'seasonal ARPA row ÷ ARPA' }; }
  return { values: csv, source: 'sheet cells (rounded to 0.1%)' };
}

// the first row labelled `label` within 6 rows after a given anchor row
function findRowAfter(rows, afterLabel, label){
  const norm = s => String(s || '').trim().toLowerCase();
  const idx = rows.findIndex(r => r.length && norm(r[0]) === norm(afterLabel));
  if (idx < 0) return null;
  for (let i = idx + 1; i < Math.min(idx + 7, rows.length); i++){
    if (rows[i].length && norm(rows[i][0]) === norm(label)) return rows[i];
  }
  return null;
}

function parseTopClients(tc){
  const out = [];
  const norm = s => String(s || '').trim().toLowerCase();
  for (const r of tc.rows){
    const name = (r[0] || '').trim();
    if (!name || norm(name) === 'total' || name.startsWith('2026')) continue;
    // monthly grid starts at col E (index 4)
    const monthly = [];
    for (let i = 4; i <= 15; i++) monthly.push(i < r.length ? num(r[i]) : null);
    const ytd = num(r[1]);
    if (ytd == null && monthly.every(v => v == null)) continue;
    out.push({ name, ytd, monthly });
  }
  return out.slice(0, 5);
}

/* ============================================================
   LIVE ROAS LADDER
   Source: receivables sheet (invoices) + ROAS tracker (churn).
   Everything keys off PAID invoices and PAYMENT dates:
   activation, milestone movement, monthly grid, annualisation.
   ============================================================ */
"use strict";

const LADDER_SOURCES = {
  receivables: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTN4F4HrbFaylUihY5v3JQ6cG8nFwpkQgpfn-zndurG2WGEKAY011cll7OwYJGuR3_wqV76pjSkG14x/pub?gid=634629514&single=true&output=csv",
  tracker:     "https://docs.google.com/spreadsheets/d/e/2PACX-1vSEEEIegwsvOyMt4ZKFffwcOyCaPVJhftkr8Wyns6u_32dUbyudrArqFFB3Ac6CjTsaEV3ui1RPoDg8/pub?gid=793116860&single=true&output=csv"
};
const AED_PER_USD = 3.6725;
const VAT_RATE = 0.05;
const ARPA_INCLUDE_BRANDS = ["Jetour"];          // CPL brands explicitly counted
const ACTIVE_ARPA_GATE = 24000;                    // sheet formula: J >= 24000 -> Active
const GRID_START = { y: 2025, m: 11 };            // Nov-25 = first grid month (sheet $L$1)
const DROPPED_KEY = 'mt_ladder_dropped_v1';       // localStorage key for manual drops

/* ---------- helpers ---------- */
const lNorm = s => String(s || '').trim().toLowerCase().replace(/[\s\-_]/g, '');
const brandKey = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
function lMoney(s){
  if (s == null) return null;
  s = String(s).replace(/AED|\$|,/g, '').trim();
  if (!s) return null;
  const v = parseFloat(s); return isNaN(v) ? null : v;
}
function lDate(s){
  s = String(s || '').trim();
  if (!s) return null;
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (!m) return null;
  let y = +m[3]; if (y < 100) y += 2000;
  const d = new Date(Date.UTC(y, +m[1]-1, +m[2]));
  return isNaN(d) ? null : d;
}
function lMilestone(s){
  s = String(s || '');
  if (/stage/i.test(s)) return null;                 // CPL, no ROAS milestone
  const m = s.match(/(\d)/); return m ? +m[1] : null;
}
const ym = d => d.getUTCFullYear()*12 + d.getUTCMonth();  // month index for diffs
const monthDiff = (a, b) => ym(b) - ym(a);

/* column getter by header alias (case/space/hyphen-insensitive) */
function colGetter(header){
  const idx = {};
  header.forEach((h, i) => { idx[lNorm(h)] = i; });
  return (row, ...names) => {
    for (const n of names){ const i = idx[lNorm(n)]; if (i != null && i < row.length) return row[i]; }
    return '';
  };
}

/* ---------- "today" from the receivables sheet header, else browser ---------- */
function sheetToday(header, rows, get){
  // 1) any header cell that parses as a date (the sheet's =TODAY() spills into the header row)
  for (const h of header){ const d = lDate(h); if (d) return d; }
  // 2) a "Todays Date" cell on any row
  for (const r of rows){ const d = lDate(get(r, 'Todays Date')); if (d) return d; }
  const n = new Date(); return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
}

/* ---------- month columns Nov-25 .. today's month ---------- */
function gridMonths(today){
  const out = [];
  let y = GRID_START.y, m = GRID_START.m;
  const endY = today.getUTCFullYear(), endM = today.getUTCMonth()+1;
  while (y < endY || (y === endY && m <= endM)){
    out.push({ y, m, label: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1] + (y !== 2026 ? ' ' + String(y).slice(2) : '') });
    m++; if (m > 12){ m = 1; y++; }
  }
  return out;
}

/* ---------- churn set from the tracker ---------- */
function parseTracker(rows){
  if (!rows.length) return { churned: new Map(), onHold: new Set() };
  const get = colGetter(rows[0]);
  const churned = new Map(), onHold = new Set();
  for (const r of rows.slice(1)){
    const b = String(get(r, 'Brand Name') || '').trim();
    if (!b || brandKey(b) === 'average') continue;
    const st = String(get(r, 'Status') || '');
    if (/churn/i.test(st)) churned.set(brandKey(b), b);
    else if (/on hold/i.test(st)) onHold.add(brandKey(b));
  }
  return { churned, onHold };
}

/* ---------- core: build the ladder from invoice rows ---------- */
function buildLadder(recvRows, trackerRows, manualDropped){
  const header = recvRows[0], get = colGetter(header);
  const today = sheetToday(header, recvRows.slice(1), get);
  const months = gridMonths(today);
  const gridStartDate = new Date(Date.UTC(GRID_START.y, GRID_START.m-1, 1));
  // sheet formula: ROUND((today - $L$1)/30, 0)
  const elapsed = Math.round((today - gridStartDate) / 86400000 / 30);

  // group invoices by brand
  const brands = new Map(), allRecvKeys = new Set();
  for (const r of recvRows.slice(1)){
    const brand = String(get(r, 'Brand Name') || get(r, 'Client Name') || '').trim();
    if (!brand) continue;
    allRecvKeys.add(brandKey(brand));
    const status = String(get(r, 'Invoice Status') || '').trim();
    const msRaw = get(r, 'ROAS- Milestone', 'ROAS Milestone');
    const ms = lMilestone(msRaw);
    const cpl = /stage/i.test(String(msRaw||''));
    const idate = lDate(get(r, 'Invoice Date'));
    const pdt = lDate(get(r, 'Payment recepit date', 'Payment receipt date'));
    const usd = lMoney(get(r, '$ Amount'));
    const aed = lMoney(get(r, 'Total'));
    const vat = String(get(r, 'VAT') || '');
    const refund = lMoney(get(r, 'Refunds VAT Exclusive', 'Refunds')) || 0;
    let gross = usd != null ? usd : (aed != null ? aed / AED_PER_USD : 0);
    if (/included/i.test(vat)) gross = gross / (1 + VAT_RATE);
    const net = Math.max(0, gross - refund);
    if (!brands.has(brand)) brands.set(brand, []);
    brands.get(brand).push({ status, ms, cpl, idate, pdt, net });
  }

  const { churned, onHold } = parseTracker(trackerRows);
  const manual = new Set((manualDropped || []).map(brandKey));

  const rowsOut = [];
  for (const [brand, invs] of brands){
    const paid = invs.filter(i => i.status === 'Paid');
    if (!paid.length) continue;
    const roas = paid.filter(i => i.ms != null);
    const hasMs = roas.length > 0;
    if (!hasMs && !ARPA_INCLUDE_BRANDS.includes(brand)) continue;   // pure influencer -> excluded
    const basisSet = hasMs ? roas : paid;
    const level = hasMs ? Math.max(...roas.map(i => i.ms)) : 0;

    const pdates = basisSet.filter(i => i.pdt).map(i => i.pdt).sort((a,b)=>a-b);
    const firstPay = pdates[0] || null, lastPay = pdates[pdates.length-1] || null;
    const moActive = firstPay ? monthDiff(firstPay, today) + 1 : 0;          // sheet C: inclusive
    // months at current level: from first PAYMENT at that level to today (sheet E)
    const atLevelPays = roas.filter(i => i.ms === level && i.pdt).map(i => i.pdt).sort((a,b)=>a-b);
    const moAtLevel = atLevelPays.length ? monthDiff(atLevelPays[0], today) : 0;

    const key = brandKey(brand);
    const isChurn = churned.has(key), isManual = manual.has(key);
    const dropped = isChurn || isManual;

    // ARPA — payment basis; dropped => total to date at ANY level
    let arpa, basis;
    const totalToDate = basisSet.reduce((a,i)=>a+i.net,0);
    if (dropped){ arpa = totalToDate; basis = 'Dropped · total to date'; }
    else if (!hasMs){ arpa = totalToDate; basis = 'Spend to date (CPL)'; }
    else if (level <= 2){ arpa = totalToDate; basis = 'ROAS spend to date'; }
    else {
      const latest = roas.filter(i=>i.pdt).sort((a,b)=>b.pdt-a.pdt)[0] || roas[roas.length-1];
      arpa = latest.net * 12; basis = 'Latest paid × 12';
    }

    // monthly grid by PAYMENT date
    const grid = months.map(mm => {
      const s = paid.filter(i => i.pdt && i.pdt.getUTCFullYear()===mm.y && i.pdt.getUTCMonth()+1===mm.m).reduce((a,i)=>a+i.net,0);
      return s > 0 ? s : null;
    });
    // ramp: whole months between first PAYMENT at consecutive milestones
    const firstPayAt = k => { const p = roas.filter(i=>i.ms===k && i.pdt).map(i=>i.pdt).sort((a,b)=>a-b); return p[0] || null; };
    const step = (a,b) => { const pa=firstPayAt(a), pb=firstPayAt(b); if(!pa||!pb) return null; return Math.max(0, Math.round((pb-pa)/86400000/30)); };
    const ramp = [step(1,2), step(2,3), step(3,4)];

    // idle months G = elapsed - lastNonZeroPos + 1  (sheet: MATCH(2,1/(L:Z<>0),1))
    let lastPos = 0; grid.forEach((v,i)=>{ if (v) lastPos = i+1; });
    const G = lastPos ? elapsed - lastPos + 1 : 999;

    // STATUS — replicate the sheet formula in order; dropped overrides to Inactive
    let status;
    if (dropped) status = 'Inactive';
    else if (moActive <= 1) status = 'Too early';
    else if (G >= 6) status = 'Inactive';
    else if (G >= level && moActive > 2) status = 'At risk';
    else if (level === 1 && G < level) status = 'Low spend';
    else if (G >= level - 1) status = 'Watch';
    else if (moAtLevel <= level - 2 && level < 5) status = 'Scaling';
    else if (arpa >= ACTIVE_ARPA_GATE) status = 'Active';
    else status = 'Low spend';

    rowsOut.push({ brand, level, moActive, moAtLevel, ramp, grid, total: totalToDate, arpa, basis, status,
      dropped, droppedBy: isManual ? 'manual' : (isChurn ? 'tracker' : null), onHold: onHold.has(key),
      since: firstPay ? firstPay.getUTCFullYear() + '-' + String(firstPay.getUTCMonth()+1).padStart(2,'0') : '',
      idleMonths: G === 999 ? null : G });
  }

  // churn warnings: churned in tracker but not present in receivables at all
  const unmatchedChurn = [];
  for (const [k, name] of churned){ if (!allRecvKeys.has(k)) unmatchedChurn.push(name); }

  const qualifying = rowsOut;
  const fleetARPA = qualifying.length ? qualifying.reduce((a,r)=>a+r.arpa,0) / qualifying.length : 0;
  return { rows: rowsOut, months, today, fleetARPA, unmatchedChurn,
    counts: { brands: rowsOut.length, dropped: rowsOut.filter(r=>r.dropped).length, churnedInTracker: churned.size } };
}

/* ---------- manual dropped persistence ---------- */
function loadManualDropped(){

}
function saveManualDropped(list){

/* ---------- fetch both sheets ---------- */
async function fetchLadderSources(){
  const [rv, tr] = await Promise.allSettled([ fetch(LADDER_SOURCES.receivables), fetch(LADDER_SOURCES.tracker) ]);
  if (rv.status !== 'fulfilled' || !rv.value.ok) throw new Error('receivables ' + (rv.reason || rv.value.status));
  const recvRows = parseCSV(await rv.value.text());
  let trackerRows = [], trackerError = null;
  if (tr.status === 'fulfilled' && tr.value.ok) trackerRows = parseCSV(await tr.value.text());
  else trackerError = 'tracker unreachable — churn auto-drops not applied';
  return { recvRows, trackerRows, trackerError };
}

/* ============================================================
   LIVE CAC SHEET
   Actuals (cost by category, monthly totals, acquisitions) come
   from the dedicated CAC sheet. Targets come from the model sheet.
   Variance = target − actual CAC (positive = under target = good).
   ============================================================ */
"use strict";

const CAC_SOURCE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTbBasF2SSMyuhYTfUswU3fh1szd4L0lnUGhD1BGhdNJ-06lFp-MFwcdQeL2ZS5LQ/pub?gid=1652171622&single=true&output=csv";
const CAC_AED_PER_USD = 3.6725;
const MON = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };

function parseMonthHeader(s){                 // "Oct-25" / "Jan-26" -> {y, m}
  const m = String(s || '').trim().match(/^([A-Za-z]{3})-(\d{2,4})$/);
  if (!m || !MON[m[1].toLowerCase()]) return null;
  let y = +m[2]; if (y < 100) y += 2000;
  return { y, m: MON[m[1].toLowerCase()] };
}
function cnum(s){                               // "$16,309.85" / "39,200" / "-" / "" -> number|null
  if (s == null) return null;
  s = String(s).trim();
  if (s === '' || s === '-' || s === '—') return null;
  const neg = /^\(.*\)$/.test(s);
  const v = parseFloat(s.replace(/[$,()]/g, ''));
  if (isNaN(v)) return null;
  return neg ? -v : v;
}

/* Build: { year, months:[{y,m}], merchant:{cats:[{name, usd:[…]}], costUSD:[…], count:[…]}, creator:{…} }
   All arrays are aligned to the sheet's month columns; get2026() maps them onto Jan..Dec 2026. */
function parseCacSheet(rows){
  const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g,' ');
  const hIdx = rows.findIndex(r => r.length && norm(r[0]) === 'category');
  if (hIdx < 0) throw new Error('CAC sheet: header row ("Category") not found');
  const header = rows[hIdx];
  const monthCols = [];                         // [{col, y, m}]
  header.forEach((h, i) => { const pm = parseMonthHeader(h); if (pm) monthCols.push({ col:i, ...pm }); });
  if (!monthCols.length) throw new Error('CAC sheet: no month columns found');
  const months = monthCols.map(c => ({ y:c.y, m:c.m }));
  const vals = r => monthCols.map(c => c.col < r.length ? cnum(r[c.col]) : null);
  const findRow = label => rows.find(r => r.length && norm(r[0]) === norm(label)) || null;

  function section(startLabel, totalUsdLabel, totalAedLabel){
    const start = rows.findIndex(r => r.length && norm(r[0]) === norm(startLabel));
    const end = rows.findIndex((r, i) => i > start && r.length && norm(r[0]) === norm(totalAedLabel));
    if (start < 0 || end < 0) throw new Error('CAC sheet: section ' + startLabel + ' not found');
    const cats = [];
    for (let i = start + 1; i < end; i++){
      const r = rows[i]; const name = String(r[0] || '').trim();
      if (!name) continue;
      const aed = vals(r);
      cats.push({ name, usd: aed.map(v => v == null ? null : v / CAC_AED_PER_USD), subTotalUSD: cnum(r[1]) });
    }
    const usdRow = findRow(totalUsdLabel), aedRow = findRow(totalAedLabel);
    const costUSD = usdRow ? vals(usdRow) : (aedRow ? vals(aedRow).map(v => v == null ? null : v / CAC_AED_PER_USD) : months.map(() => null));
    return { cats, costUSD, subTotalUSD: aedRow ? cnum(aedRow[1]) : null };
  }
  const merchant = section('MERCHANT CAC', 'Total Merchant Cost — USD', 'Total Merchant Cost — AED');
  const creator  = section('CREATOR CAC',  'Total Creator Cost — USD',  'Total Creator Cost — AED');
  const nc = findRow('New Clients'), ncr = findRow('New Creators');
  merchant.count = nc ? vals(nc) : months.map(() => null);
  creator.count  = ncr ? vals(ncr) : months.map(() => null);
  // the sheet's own per-month CAC rows, kept for cross-checking
  const mcac = findRow('CAC per New Client (USD)'), ccac = findRow('CAC per New Creator (USD)');
  merchant.sheetCAC = mcac ? vals(mcac) : null; creator.sheetCAC = ccac ? vals(ccac) : null;
  return { months, merchant, creator, title: rows[0] && rows[0][0] || '', subtitle: rows[1] && rows[1][0] || '' };
}

/* Map a sheet-aligned array onto Jan..Dec of `year` (null where the sheet has no column). */
function onYear(parsed, arr, year){
  const out = Array(12).fill(null);
  parsed.months.forEach((mm, i) => { if (mm.y === year) out[mm.m - 1] = arr[i]; });
  return out;
}
function cacFor2026(parsed, year){
  const side = s => ({
    cost: onYear(parsed, s.costUSD, year),
    count: onYear(parsed, s.count, year),
    cats: s.cats.map(c => ({ name: c.name, usd: onYear(parsed, c.usd, year) })),
    sheetCAC: s.sheetCAC ? onYear(parsed, s.sheetCAC, year) : null,
    priorYear: parsed.months.filter(mm => mm.y < year).map((mm, k) => ({ y:mm.y, m:mm.m }))  // for the Method note
  });
  return { merchant: side(parsed.merchant), creator: side(parsed.creator), source: 'cac-sheet', asOf: parsed.subtitle };
}

async function fetchCacSheet(year){
  const res = await fetch(CAC_SOURCE);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const parsed = parseCacSheet(parseCSV(await res.text()));
  return cacFor2026(parsed, year);
}

/* ---------- palette (mirrors CSS custom properties) ---------- */
function cssv(name, fallback){
  try{ const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || fallback; }

/* ---------- formatters ---------- */
const fmtMoney = v => (v == null || isNaN(v)) ? '—' : (v < 0 ? '-$' : '$') + Math.round(Math.abs(v)).toLocaleString('en-US');
const fK = v => {
  if (v == null || isNaN(v)) return '—';
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e6) return s + '$' + (a/1e6).toFixed(2).replace(/\.?0+$/,'') + 'M';
  if (a >= 1e3) return s + '$' + Math.round(a/1e3) + 'K';
  return s + '$' + Math.round(a);
};
const fMshort = v => (v == null || isNaN(v)) ? '—' : (v<0?'-':'') + '$' + (Math.abs(v)/1e6).toFixed(2) + 'M';
const fPct = (v, dp=0) => (v == null || isNaN(v)) ? '—' : (v*100).toFixed(dp) + '%';
const fNum = v => (v == null || isNaN(v)) ? '—' : Math.round(v).toLocaleString('en-US');
const f1 = v => (v == null || isNaN(v)) ? '—' : v.toLocaleString('en-US', {minimumFractionDigits:1, maximumFractionDigits:1});
const sum = a => a.reduce((x,y)=>x+(y||0),0);
const padA = a => a.concat(Array(Math.max(0,12-a.length)).fill(null));

/* Sign-aware delta span. goodPos=true => positive is good. */
function deltaSpan(v, opts){
  const o = Object.assign({goodPos:true, fmt:fNum}, opts||{});
  if (v === 0 || v == null || isNaN(v)) return '<span class="muted num">—</span>';
  const good = o.goodPos ? v > 0 : v < 0;
  return '<span class="' + (good?'delta-good':'delta-bad') + ' num" data-v="' + v + '" data-goodpos="' + o.goodPos + '">' +
    (v > 0 ? '▲' : '▼') + ' ' + o.fmt(Math.abs(v)) + '</span>';
}

/* ============================================================
   ENGINE — used ONLY by the Scenario Planner. Replicates the
   sheet's projection math from its raw inputs.
   ============================================================ */
function engine(L){
  const seas = DATA.seasonality, prior = DATA.prior2025, dist = DATA.distribution;
  const li = DATA.meta.latestClosedIdx;
  const priorTotal = sum(prior);
  const seasARPA = seas.map(s => L.arpa * s);
  const existingPlan = prior.map(p => p * (1 + L.growth));
  const signedPlan = dist.map(d => Math.round(d * L.newClients));
  const cumPlan = []; signedPlan.reduce((a,b,i)=> (cumPlan[i]=a+b, cumPlan[i]), 0);
  const newRevOf = (signed, cum) => signed.map((_, m) => {
    const mature = m >= 3 ? cum[m-3] : 0;
    const ramp = signed[m] + (signed[m-1]||0) + (signed[m-2]||0);
    return mature * seasARPA[m] + ramp * seasARPA[m] * (1 - L.dropout);
  });
  const newRevPlan = newRevOf(signedPlan, cumPlan);
  const planRev = existingPlan.map((e,m) => e + newRevPlan[m]);
  const rev = planRev.map((p,m) => m <= li ? DATA.actualRevenue[m] : p);
  const signedStop = signedPlan.map((s,m) => m <= li ? (DATA.actualNewClients[m]||0) : 0);
  const cumStop = []; signedStop.reduce((a,b,i)=> (cumStop[i]=a+b, cumStop[i]), 0);
  const stopRev = existingPlan.map((e,m) => e + newRevOf(signedStop, cumStop)[m]);
  const stopBlend = stopRev.map((p,m) => m <= li ? DATA.actualRevenue[m] : p);
  const arrOf = series => series.map((_,m) => { const w=[]; for (let k=Math.max(0,m-2); k<=m; k++) w.push(series[k]/seas[k]); return sum(w)/w.length; });
  const arr = arrOf(rev), arrStop = arrOf(stopBlend);
  const custEqTarget = cumPlan.map(c => Math.round(priorTotal / L.arpa + c));
  const ltv = L.arpa * (1 - L.dropout) / L.churn;
  return { seasARPA, existingPlan, signedPlan, cumPlan, newRevPlan, planRev, rev, stopBlend, arr, arrStop, custEqTarget,
    ltv, ltvcac: ltv / L.cac, payback: L.cac / (L.arpa * L.gm / 12), nrr: sum(existingPlan) / priorTotal,
    yeARR: arr[11], latestARR: arr[li], fyPlanRevenue: sum(planRev), ytdPlan: sum(planRev.slice(0, li+1)) };
}

/* ---------- state ---------- */
const state = { levers: null, ladderSort: 'arpa', manualDropped: [] };
window.__state = state; window.__engine = engine;

  <section class="page" id="page-method">
    <div class="page-head"><h1>Method</h1><div class="page-sub">How every number is produced — in plain language, with every source and assumption stated.</div></div>
    <div class="card method" id="method-body"></div>
  </section>`;
}

/* ============================================================
   CHARTS
   ============================================================ */
const charts = {};
function mkChart(id, cfg){
  const el = document.getElementById(id); if (!el) return;
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(el.getContext('2d'), cfg);
}
function setChartDefaults(){
  Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
  Chart.defaults.font.size = 11.5;
  Chart.defaults.color = C.muted;
  Chart.defaults.devicePixelRatio = Math.max(2, (window.devicePixelRatio || 1));
  Chart.defaults.plugins.legend.labels.boxWidth = 10;
  Chart.defaults.plugins.legend.labels.boxHeight = 10;
  Chart.defaults.plugins.legend.labels.padding = 14;
  Chart.defaults.plugins.legend.labels.usePointStyle = true;
  Chart.defaults.plugins.legend.labels.font = { size: 11.5, weight: '500' };
  if (Chart.defaults.elements && Chart.defaults.elements.point) Chart.defaults.elements.point.hoverRadius = 5;
}
const darkTooltip = { backgroundColor:'#1E2530', titleColor:'#fff', bodyColor:'#D7DCE3', padding:10, cornerRadius:8, displayColors:true, boxPadding:4,
  callbacks:{ label: ctx => ' ' + ctx.dataset.label + ': ' + (ctx.parsed.y==null ? '—' : fK(ctx.parsed.y)) } };
const xScale = { grid:{display:false}, ticks:{color:C.muted} };
const yMoney = extra => Object.assign({ beginAtZero:true, grid:{color:C.grid}, border:{display:false}, ticks:{color:C.muted, callback:v=>fK(v)} }, extra||{});
const yCount = { beginAtZero:true, grid:{color:C.grid}, border:{display:false}, ticks:{color:C.muted, callback:v=>fNum(v)} };
const lineOpts = (tooltipFmt) => ({ responsive:true, maintainAspectRatio:false, interaction:{intersect:false, mode:'index'},
  plugins:{ tooltip: tooltipFmt ? {...darkTooltip, callbacks:{label:c=>' '+c.dataset.label+': '+(c.parsed.y==null?'—':tooltipFmt(c.parsed.y))}} : darkTooltip, legend:{position:'bottom'} } });
function sparkline(id, values, color){
  const vals = values.filter(v=>v!=null);
  mkChart(id, { type:'line', data:{ labels: vals.map((_,i)=>i), datasets:[{ data: vals, borderColor:color, borderWidth:1.6, pointRadius:0, fill:true, backgroundColor: color+'22', tension:.35 }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{enabled:false}}, scales:{x:{display:false}, y:{display:false}}, animation:false } });
}
const floorMillion = vals => { const v = vals.filter(x=>x!=null); return v.length ? Math.max(0, Math.floor(Math.min(...v)/1e6)*1e6) : 0; };

/* ============================================================
   RENDER — model pages (mirror the sheet)
   ============================================================ */
function renderModel(){
  const D = DATA, li = D.meta.latestClosedIdx, M = D.months;
  const closedLabel = M[li];
  document.getElementById('cockpit-sub').textContent = 'Moontech platform revenue, annualised run-rate and the path to the year-end target — live from the model sheet. Actuals closed through ' + closedLabel + ' 2026; later months are the sheet\'s projection.';
  document.getElementById('tag-latest').textContent = closedLabel + ', run-rate';
  document.getElementById('tag-ytd').textContent = 'Jan–' + closedLabel + ' actual';

  /* ---------- COCKPIT ---------- */
  const ytdActual = sum(D.actualRevenue), ytdPlan = sum(D.totalPlanRev.slice(0, li+1));
  const yeGap = D.yeARR - D.targetARR;
  document.getElementById('k-latest-arr').textContent = fMshort(D.latestARR);
  const latestDelta = D.arrPath[li] - D.arrPath[li-1];
  document.getElementById('k-latest-note').innerHTML = deltaSpan(latestDelta, {fmt:fK}) + ' vs ' + M[li-1];
  document.getElementById('k-ye-arr').textContent = fMshort(D.yeARR);
  document.getElementById('k-ye-note').innerHTML = (yeGap >= 0 ? '<span class="chip chip-good">hits target</span>' : '<span class="chip chip-bad">misses target</span>') + ' ' + deltaSpan(yeGap, {fmt:fK}) + ' vs ' + fK(D.targetARR);
  document.getElementById('k-ytd').textContent = fK(ytdActual);
  document.getElementById('k-ytd-note').innerHTML = deltaSpan(ytdActual - ytdPlan, {fmt:fK}) + ' vs plan YTD (' + fK(ytdPlan) + ')';
  const newcYTD = sum(D.actualNewClients), newcTgt = sum(D.signedTarget.slice(0, li+1));
  document.getElementById('k-newc').textContent = newcYTD;
  document.getElementById('k-newc-note').innerHTML = deltaSpan(newcYTD - newcTgt) + ' vs plan of ' + newcTgt;

  sparkline('spark-arr', D.arrPath.slice(0, li+1), latestDelta>=0?C.good:C.bad);
  sparkline('spark-ye', D.arrPath.slice(li), yeGap>=0?C.good:C.warn);
  const revDelta = D.actualRevenue[li] - D.actualRevenue[li-1];
  sparkline('spark-rev', D.actualRevenue, revDelta>=0?C.good:C.bad);
  const ncDelta = (D.actualNewClients[li]||0) - (D.actualNewClients[li-1]||0);
  sparkline('spark-newc', D.actualNewClients, ncDelta>=0?C.good:C.bad);

  mkChart('ch-arr', { type:'line', data:{ labels:M, datasets:[
    { label:'Actual ARR', data: D.arrPath.map((v,m)=> m<=li ? v : null), borderColor:C.dark, backgroundColor:C.dark, borderWidth:2.4, pointRadius:2.5, tension:.3 },
    { label:'Projected (sheet)', data: D.arrPath.map((v,m)=> m>=li ? v : null), borderColor:C.accent, backgroundColor:C.accent, borderWidth:2.4, pointRadius:2.5, tension:.3 },
    { label:'Target ARR', data: M.map(()=>D.targetARR), borderColor:C.warn, borderWidth:1.2, pointRadius:0, borderDash:[2,3] }
  ]}, options:{ ...lineOpts(), scales:{ x:xScale, y: yMoney({ beginAtZero:false, min: floorMillion(D.arrPath) }) } }});

  mkChart('ch-rev', { type:'bar', data:{ labels:M, datasets:[
    { label:'Actual', data: padA(D.actualRevenue), backgroundColor:C.dark, borderRadius:4, barPercentage:.62, order:3 },
    { label:'Projected (sheet)', data: D.monthlyRevPlan.map((v,m)=> m>li ? v : null), backgroundColor:C.accentTint, borderRadius:4, barPercentage:.62, order:3 },
    { label:'Full-year plan', data: D.totalPlanRev, type:'line', borderColor:C.accent, borderWidth:1.6, pointRadius:0, tension:.3, order:1 }
  ]}, options:{ ...lineOpts(), scales:{ x:xScale, y:yMoney() } }});

  let ct = '<table><tr><th class="txt">Month</th><th>Actual</th><th>Plan</th><th>Variance</th><th>ARR</th><th>Cumulative revenue</th></tr>';
  for (let m=0; m<12; m++){
    const closed = m <= li;
    ct += '<tr><td class="txt">' + M[m] + (closed?'':' <span class="tag">proj</span>') + '</td>' +
      '<td class="num">' + (closed ? fmtMoney(D.actualRevenue[m]) : '<span class="muted">—</span>') + '</td>' +
      '<td class="num muted">' + fmtMoney(D.totalPlanRev[m]) + '</td>' +
      '<td class="num">' + (closed ? deltaSpan(D.actualRevenue[m]-D.totalPlanRev[m], {fmt:fK}) : '<span class="muted">—</span>') + '</td>' +
      '<td class="num">' + fK(D.arrPath[m]) + '</td><td class="num">' + fmtMoney(D.cumRevenue[m]) + '</td></tr>';
  }
  ct += '<tr class="total"><td class="txt">Full year</td><td class="num">' + fmtMoney(ytdActual) + ' <span class="tag">YTD</span></td>' +
    '<td class="num">' + fmtMoney(D.totalPlanRevFY) + '</td><td class="num">' + deltaSpan(ytdActual - ytdPlan,{fmt:fK}) + ' <span class="tag">YTD</span></td>' +
    '<td class="num">' + fK(D.yeARR) + ' <span class="tag">YE</span></td><td class="num">' + fmtMoney(D.cumRevenue[11]) + '</td></tr></table>';
  document.getElementById('tbl-cockpit').innerHTML = ct;

  /* ---------- TARGETS ---------- */
  document.getElementById('sub-custeq').textContent = 'One customer-equivalent = ' + fK(D.defaults.arpa) + ' of annual revenue. Full-year target: ' + fNum(D.custEqFY) + ' equivalents for ' + fK(D.targetARR) + ' ARR.';
  mkChart('ch-custeq', { type:'bar', data:{ labels:M, datasets:[
    { label:'Actual', data: padA(D.custEqActual), backgroundColor:C.dark, borderRadius:4, barPercentage:.6 },
    { label:'Target', data: D.custEqTarget, type:'line', borderColor:C.accent, borderWidth:1.8, pointRadius:2, tension:.25 }
  ]}, options:{ ...lineOpts(fNum), scales:{ x:xScale, y:yCount } }});
  const cumActualSigned = []; D.actualNewClients.forEach((v,i)=>{ cumActualSigned[i] = (cumActualSigned[i-1]||0) + (v||0); });
  const cumActualPadded = padA(cumActualSigned.slice(0, li+1));
  mkChart('ch-signed', { type:'line', data:{ labels:M, datasets:[
    { label:'Actual cumulative', data: cumActualPadded, borderColor:C.dark, backgroundColor:C.dark, borderWidth:2.4, pointRadius:2.6, pointBackgroundColor:C.dark, spanGaps:false, tension:.15 },
    { label:'Plan cumulative', data: D.cumSignedPlan, borderColor:C.accent, borderWidth:1.8, pointRadius:0, tension:.25 }
  ]}, options:{ ...lineOpts(fNum), scales:{ x:xScale, y:yCount } }});
  const mixAll = D.existingShareActual.concat(D.existingShareTarget).filter(v=>v!=null);
  mkChart('ch-mix', { type:'line', data:{ labels:M, datasets:[
    { label:'Existing share — actual', data: D.existingShareActual, borderColor:C.dark, borderWidth:2.4, pointRadius:2.6, pointBackgroundColor:C.dark, spanGaps:false, tension:0 },
    { label:'Existing share — plan', data: D.existingShareTarget, borderColor:C.accent, borderWidth:1.8, pointRadius:0, tension:.3 }
  ]}, options:{ ...lineOpts(v=>fPct(v,1)), scales:{ x:xScale, y:{ min:Math.max(0, Math.floor((Math.min(...mixAll)-0.05)*10)/10), max:Math.max(...mixAll)+0.03, grid:{color:C.grid}, border:{display:false}, ticks:{color:C.muted, callback:v=>fPct(v)} } } }});

  let tc2 = '<table><tr><th class="txt">Month</th><th>Returning (2025)</th><th>Active ROAS (cum.)</th><th>Total active</th><th>Returning %</th></tr>';
  for (let m=0; m<=li; m++){
    const ret = D.returningClients[m], roas = D.roasActiveCum[m], tot = D.totalActive[m] != null ? D.totalActive[m] : (ret||0)+(roas||0);
    tc2 += '<tr><td class="txt">'+M[m]+'</td><td class="num">'+fNum(ret)+'</td><td class="num">'+fNum(roas)+'</td><td class="num">'+fNum(tot)+'</td><td class="num">'+(tot?fPct(ret/tot):'—')+'</td></tr>';
  }
  document.getElementById('tbl-counts').innerHTML = tc2 + '</table>';

  const rowT = (label, arr, fmt, fy) => '<tr><td class="txt">'+label+'</td>' + arr.map(v => '<td class="num">' + (v==null?'<span class="muted">—</span>':fmt(v)) + '</td>').join('') + '<td class="num"><b>' + (fy==null?'—':fmt(fy)) + '</b></td></tr>';
  const rowVar = (t, a, fmt, fyVar) => {
    let cells = '';
    for (let m=0; m<12; m++){ cells += (t[m]==null || a[m]==null) ? '<td class="num muted">—</td>' : '<td class="num">' + deltaSpan(a[m]-t[m], {fmt}) + '</td>'; }
    return '<tr class="var-row"><td class="txt">Variance</td>' + cells + '<td class="num">' + (fyVar==null?'—':deltaSpan(fyVar,{fmt})) + '</td></tr>';
  };
  const ceA = padA(D.custEqActual), naA = padA(D.actualNewClients), arA = padA(D.actualRevenue);
  let tt = '<table><tr><th class="txt"></th>' + M.map(m=>'<th>'+m+'</th>').join('') + '<th>FY</th></tr>';
  tt += rowT('Target customer-equivalents', D.custEqTarget, fNum, D.custEqFY);
  tt += rowT('Actual customer-equivalents', ceA, fNum, null);
  tt += rowVar(D.custEqTarget, ceA, fNum, null);
  tt += rowT('Target new clients signed', D.signedTarget, fNum, sum(D.signedTarget));
  tt += rowT('Actual new clients signed', naA, fNum, newcYTD);
  tt += rowVar(D.signedTarget, naA, fNum, newcYTD - newcTgt);
  tt += rowT('Plan revenue', D.totalPlanRev, fK, D.totalPlanRevFY);
  tt += rowT('Actual revenue', arA, fK, ytdActual);
  tt += rowVar(D.totalPlanRev, arA, fK, ytdActual - ytdPlan);
  document.getElementById('tbl-targets').innerHTML = tt + '</table>';

  /* ---------- TOP CLIENTS ---------- */
  document.getElementById('top-sub').textContent = 'Concentration in the existing book, Jan–' + closedLabel + ' 2026 actuals from the model sheet.';
  const tcs = D.topClients.map(c => ({ name:c.name, monthly:c.monthly.slice(0, li+1), ytd: c.ytd != null ? c.ytd : sum(c.monthly) }));
  const top1 = tcs[0], top5ytd = sum(tcs.map(c=>c.ytd));
  document.getElementById('k-top1').textContent = fPct(top1.ytd / ytdActual, 1);
  document.getElementById('k-top1-note').textContent = top1.name + ' · ' + fK(top1.ytd) + ' YTD';
  document.getElementById('k-top5').textContent = fPct(top5ytd / ytdActual, 1);
  document.getElementById('k-rest').textContent = fPct(1 - top5ytd / ytdActual, 1);
  document.getElementById('k-rest-note').textContent = fK(ytdActual - top5ytd) + ' across the rest of the book';
  const topColors = [C.accent, '#8B83EC', C.accentTint, '#DEDBF9', '#EEEDFB'];
  const monthsClosed = M.slice(0, li+1);
  mkChart('ch-top', { type:'bar', data:{ labels:monthsClosed, datasets:
    tcs.map((c,i)=>({ label:c.name, data:c.monthly.map((v,m)=> (v||0)/D.actualRevenue[m]), backgroundColor:topColors[i], stack:'s', borderRadius:2, barPercentage:.62 }))
    .concat([{ label:'Rest of book', data: monthsClosed.map((_,m)=> Math.max(0, 1 - sum(tcs.map(c=>c.monthly[m]))/D.actualRevenue[m])), backgroundColor:'#E7E6E3', stack:'s', borderRadius:2, barPercentage:.62 }])
  }, options:{ ...lineOpts(v=>fPct(v,1)), scales:{ x:{...xScale, stacked:true}, y:{ stacked:true, min:0, max:1, grid:{color:C.grid}, border:{display:false}, ticks:{color:C.muted, callback:v=>fPct(v)} } } }});
  let tp = '<table><tr><th class="txt">Client</th>' + monthsClosed.map(m=>'<th>'+m+'</th>').join('') + '<th>YTD</th><th>Share</th></tr>';
  tcs.forEach(c => { tp += '<tr><td class="txt">'+c.name+'</td>' + c.monthly.map(v=>'<td class="num">'+(v?fK(v):'<span class="muted">—</span>')+'</td>').join('') + '<td class="num"><b>'+fK(c.ytd)+'</b></td><td class="num">'+fPct(c.ytd/ytdActual,1)+'</td></tr>'; });
  tp += '<tr class="total"><td class="txt">Top 5</td>' + monthsClosed.map((_,m)=>'<td class="num">'+fK(sum(tcs.map(c=>c.monthly[m])))+'</td>').join('') + '<td class="num">'+fK(top5ytd)+'</td><td class="num">'+fPct(top5ytd/ytdActual,1)+'</td></tr></table>';
  document.getElementById('tbl-top').innerHTML = tp;
  let tconc = '<table><tr><th class="txt">Client</th>' + monthsClosed.map(m=>'<th>'+m+'</th>').join('') + '<th>YTD</th></tr>';
  tcs.forEach(c => { tconc += '<tr><td class="txt">'+c.name+'</td>' + c.monthly.map((v,m)=>'<td class="num">'+(v?fPct(v/D.actualRevenue[m],1):'<span class="muted">—</span>')+'</td>').join('') + '<td class="num"><b>'+fPct(c.ytd/ytdActual,1)+'</b></td></tr>'; });
  tconc += '<tr class="total"><td class="txt">Top 5 combined</td>' + monthsClosed.map((_,m)=>'<td class="num">'+fPct(sum(tcs.map(c=>c.monthly[m]))/D.actualRevenue[m],1)+'</td>').join('') + '<td class="num">'+fPct(top5ytd/ytdActual,1)+'</td></tr></table>';
  document.getElementById('tbl-concentration').innerHTML = tconc;

  /* ---------- CAC ---------- */
  const mc = D.cac.merchant, cc = D.cac.creator;
  const liveCac = D.cac.source === 'cac-sheet';
  const hasCount = (src,m) => src.count[m] != null && src.count[m] > 0;
  // closed CAC months = months with a cost recorded (from the CAC sheet), capped to the model's closed month
  const cacLi = Math.min(li, mc.cost.reduce((acc,v,i)=> v!=null ? i : acc, -1));
  const cacMonths = M.slice(0, cacLi+1);
  // headline: blended YTD = 2026 cost ÷ 2026 acquisitions (the CAC sheet's own Total/Avg cell is not reproducible from its monthlies, so it is not shown)
  const blended = src => { let cost=0, n=0; for (let m=0; m<=cacLi; m++){ if (src.cost[m]!=null) cost+=src.cost[m]; if (src.count[m]!=null) n+=src.count[m]; } return { cost, n, cac: n ? cost/n : null }; };
  let mB, cB;
  if (liveCac){ mB = blended(mc); cB = blended(cc); }
  else { mB = { cost: mc.fy.cost, n: mc.fy.count, cac: mc.fy.cac }; cB = { cost: cc.fy.cost, n: cc.fy.count, cac: cc.fy.cac }; }
  const cw = document.getElementById('cac-warn');
  cw.style.display = liveCac ? 'none' : 'block';
  cw.innerHTML = liveCac ? '' : '<b>CAC sheet unreachable</b> (' + (D.cac.error || 'fetch failed') + ') — showing the model sheet\'s CAC section instead. Category breakdown is unavailable until the CAC sheet loads.';
  const basisTag = liveCac ? 'blended · Jan–' + M[cacLi] : 'model sheet · full year';
  document.getElementById('tag-mcac').textContent = basisTag; document.getElementById('tag-ccac').textContent = basisTag;
  document.getElementById('tag-mcount').textContent = liveCac ? 'Jan–' + M[cacLi] : 'model sheet'; document.getElementById('tag-ccount').textContent = liveCac ? 'Jan–' + M[cacLi] : 'model sheet';
  document.getElementById('k-mcac').textContent = fmtMoney(mB.cac);
  document.getElementById('k-mcac-note').innerHTML = deltaSpan(mc.target - mB.cac, {fmt:fmtMoney}) + ' vs ' + fmtMoney(mc.target) + ' target';
  document.getElementById('k-mcount').textContent = fNum(mB.n);
  document.getElementById('k-mspend').textContent = fmtMoney(mB.cost) + ' acquisition cost';
  document.getElementById('k-ccac').textContent = fmtMoney(cB.cac);
  document.getElementById('k-ccac-note').innerHTML = deltaSpan(cc.target - cB.cac, {fmt:fmtMoney}) + ' vs ' + fmtMoney(cc.target) + ' target';
  document.getElementById('k-ccount').textContent = fNum(cB.n);
  document.getElementById('k-cspend').textContent = fmtMoney(cB.cost) + ' acquisition cost';
  const cacChart = (id, src) => mkChart(id, { type:'bar', data:{ labels:cacMonths, datasets:[
    { label:'Actual CAC', data: cacMonths.map((_,m)=> hasCount(src,m) ? src.cost[m]/src.count[m] : null),
      backgroundColor: cacMonths.map((_,m)=> hasCount(src,m) ? (src.cost[m]/src.count[m] <= src.target ? C.dark : '#D08A93') : 'transparent'), borderRadius:4, barPercentage:.62 },
    { label:'Target (model)', data: cacMonths.map(()=>src.target), type:'line', borderColor:C.warn, borderWidth:1.5, borderDash:[4,3], pointRadius:0 }
  ]}, options:{ ...lineOpts(fmtMoney), scales:{ x:xScale, y:yMoney() } }});
  cacChart('ch-mcac', mc); cacChart('ch-ccac', cc);
  const cacTable = (src, unit, B) => {
    let t = '<table><tr><th class="txt">Month</th><th>Acq. cost</th><th>'+unit+'</th><th>CAC</th><th>vs target</th></tr>';
    for (let m=0; m<=cacLi; m++){
      const v = hasCount(src,m) ? src.cost[m]/src.count[m] : null;
      t += '<tr><td class="txt">'+M[m]+'</td><td class="num">'+(src.cost[m]!=null?fmtMoney(src.cost[m]):'<span class="muted">—</span>')+'</td>' +
        '<td class="num">'+(src.count[m]!=null?fNum(src.count[m]):'<span class="muted">—</span>')+'</td>' +
        '<td class="num">'+(v!=null?fmtMoney(v):'<span class="muted">n/a</span>')+'</td>' +
        '<td class="num">'+(v!=null?deltaSpan(src.target-v,{fmt:fmtMoney}):'<span class="muted">—</span>')+'</td></tr>';
    }
    t += '<tr class="total"><td class="txt">' + (liveCac ? 'Blended YTD' : 'Full year <span class="tag">model sheet</span>') + '</td><td class="num">'+fmtMoney(B.cost)+'</td><td class="num">'+fNum(B.n)+'</td><td class="num">'+fmtMoney(B.cac)+'</td><td class="num">'+(B.cac!=null?deltaSpan(src.target-B.cac,{fmt:fmtMoney}):'—')+'</td></tr></table>';
    return t;
  };
  document.getElementById('tbl-mcac').innerHTML = cacTable(mc, 'Merchants', mB);
  document.getElementById('tbl-ccac').innerHTML = cacTable(cc, 'Creators', cB);

  // category breakdown (CAC sheet only)
  const CAT_COLORS = [C.accent, '#8B83EC', '#2A2740', C.accentTint, '#C77A0F', '#0E9F6E', '#98A2B3'];
  const catBlock = (side, chartId, tblId, cardId) => {
    const card = document.getElementById(cardId);
    if (!liveCac || !side.cats || !side.cats.length){ card.style.display = 'none'; return; }
    card.style.display = '';
    const cats = side.cats.filter(k => k.usd.some(v => v));
    mkChart(chartId, { type:'bar', data:{ labels:cacMonths, datasets: cats.map((k,i)=>({ label:k.name, data:cacMonths.map((_,m)=>k.usd[m]||0), backgroundColor:CAT_COLORS[i%CAT_COLORS.length], stack:'c', borderRadius:2, barPercentage:.62 })) },
      options:{ ...lineOpts(), scales:{ x:{...xScale, stacked:true}, y:yMoney({stacked:true}) } }});
    let t = '<table><tr><th class="txt">Category</th>' + cacMonths.map(m=>'<th>'+m+'</th>').join('') + '<th>YTD</th><th>Share</th></tr>';
    const ytdTotal = sum(cacMonths.map((_,m)=>side.cost[m]));
    cats.forEach(k => { const y = sum(cacMonths.map((_,m)=>k.usd[m])); t += '<tr><td class="txt">'+k.name+'</td>' + cacMonths.map((_,m)=>'<td class="num">'+(k.usd[m]?fK(k.usd[m]):'<span class="muted">—</span>')+'</td>').join('') + '<td class="num"><b>'+fK(y)+'</b></td><td class="num">'+fPct(y/ytdTotal,1)+'</td></tr>'; });
    t += '<tr class="total"><td class="txt">Total</td>' + cacMonths.map((_,m)=>'<td class="num">'+fK(side.cost[m])+'</td>').join('') + '<td class="num">'+fK(ytdTotal)+'</td><td class="num">100%</td></tr></table>';
    document.getElementById(tblId).innerHTML = t;
  };
  catBlock(mc, 'ch-mcat', 'tbl-mcat', 'card-mcat');
  catBlock(cc, 'ch-ccat', 'tbl-ccat', 'card-ccat');

  /* ---------- LEVERS (read-only) ---------- */
  const L = D.defaults;
