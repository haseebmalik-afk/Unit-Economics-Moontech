/* ============================================================
   RENDER — Scenario Planner (engine)
   ============================================================ */
function renderPlanner(){
  const D = DATA, li = D.meta.latestClosedIdx, M = D.months, L = state.levers;
  // calibration: the engine at the sheet's own assumptions vs the sheet's plan row
  const R_ref = engine(D.defaults);
  const maxDev = Math.max(...D.totalPlanRev.map((v,m)=> v==null ? 0 : Math.abs(R_ref.planRev[m]-v)));
  const yeDev = Math.abs(R_ref.yeARR - D.yeARR);
  state.calibration = { maxDev, yeDev };
  document.getElementById('calib-note').innerHTML = 'Engine check: at the sheet\'s own assumptions this engine reproduces the sheet\'s monthly plan to within ' + fmtMoney(maxDev) + ' and year-end ARR to within ' + fmtMoney(yeDev) + ' (seasonality source: ' + D.seasonalitySource + ').';
  const R = engine(L); state.result = R;
  const yeGap = R.yeARR - L.targetARR;
  document.getElementById('live-heading').innerHTML =
    'At <span class="v">' + fPct(L.growth) + '</span> existing-book growth, <span class="v">' + fNum(L.newClients) + '</span> new clients at <span class="v">' + fK(L.arpa) + '</span> ARPA with <span class="v">' + fPct(L.dropout) + '</span> early dropout → year-end ARR <span class="v num">' + fMshort(R.yeARR) + '</span> against a <span class="v num">' + fK(L.targetARR) + '</span> target — ' +
    (yeGap>=0 ? '<span class="delta-good" data-v="'+yeGap+'" data-goodpos="true">on target, ▲ ' + fK(yeGap) + ' of headroom</span>' : '<span class="delta-bad" data-v="'+yeGap+'" data-goodpos="true">▼ short by ' + fK(Math.abs(yeGap)) + '</span>') + '.';
  const outs = [
    { l:'Year-end ARR', v:fMshort(R.yeARR), n:(yeGap>=0?'▲ ':'▼ ') + fK(Math.abs(yeGap)) + ' vs target', ok:yeGap>=0 },
    { l:'If signings stop now', v:fMshort(R.arrStop[11]), n:'year-end ARR with zero new signings' },
    { l:'FY plan revenue', v:fK(R.fyPlanRevenue), n:'existing ' + fK(sum(R.existingPlan)) + ' + new ' + fK(sum(R.newRevPlan)) },
    { l:'LTV : CAC', v:R.ltvcac.toFixed(1)+'x', n:'LTV ' + fK(R.ltv), ok:R.ltvcac>=3 },
    { l:'Payback', v:f1(R.payback)+' mo', n:'months of gross profit to repay CAC', ok:R.payback<=12 },
    { l:'NRR (existing)', v:fPct(R.nrr), n:'of the 2025 base', ok:R.nrr>=1 }
  ];
  document.getElementById('planner-outputs').innerHTML = outs.map(o => '<div class="locked" style="border-style:solid"><span>'+o.l+'<br><span class="muted" style="font-size:10.5px">'+o.n+'</span></span><b class="num ' + (o.ok===true?'delta-good':(o.ok===false?'delta-bad':'')) + '" data-static="1">'+o.v+'</b></div>').join('');
  mkChart('ch-plan-arr', { type:'line', data:{ labels:M, datasets:[
    { label:'Actual ARR', data: R.arr.map((v,m)=> m<=li ? v : null), borderColor:C.dark, backgroundColor:C.dark, borderWidth:2.4, pointRadius:2.5, tension:.3 },
    { label:'Projected (levers)', data: R.arr.map((v,m)=> m>=li ? v : null), borderColor:C.accent, backgroundColor:C.accent, borderWidth:2.4, pointRadius:2.5, tension:.3 },
    { label:'If signings stop', data: R.arrStop.map((v,m)=> m>=li ? v : null), borderColor:C.grey, borderWidth:1.6, pointRadius:0, borderDash:[5,4], tension:.3 },
    { label:'Target ARR', data: M.map(()=>L.targetARR), borderColor:C.warn, borderWidth:1.2, pointRadius:0, borderDash:[2,3] }
  ]}, options:{ ...lineOpts(), scales:{ x:xScale, y:yMoney({ beginAtZero:false, min: floorMillion(R.arr.concat(R.arrStop)) }) } }});
  const scen = SCENARIOS.map(s => { const set = typeof s.set === 'function' ? s.set(D.defaults) : s.set; const lv = Object.assign({}, D.defaults, { targetARR: L.targetARR }, set); return { s, lv, r: engine(lv) }; });
  const hits = scen.filter(x => x.r.yeARR >= L.targetARR).length;
  const banner = document.getElementById('scen-banner');
  banner.className = 'scen-banner ' + (hits >= 1 ? 'ok' : 'warn');
  banner.textContent = hits + ' of ' + scen.length + ' preset scenarios reach the ' + fK(L.targetARR) + ' year-end ARR target.';
  document.getElementById('scen-cards').innerHTML = scen.map((x,i) => {
    const hit = x.r.yeARR >= L.targetARR;
    return '<div class="scen-card' + (hit?' hit':'') + '"><h3>' + x.s.name + '</h3><span class="chip ' + (hit?'chip-good':'chip-bad') + '">' + (hit?'hits ':'misses ') + fK(L.targetARR) + '</span>' +
      '<div class="assum">' + x.s.desc + '<br><span class="muted">' + fPct(x.lv.growth) + ' growth · ' + fNum(x.lv.newClients) + ' clients · ' + fPct(x.lv.dropout) + ' dropout</span></div>' +
      '<div class="scen-out"><span>Year-end ARR</span><b class="num">' + fMshort(x.r.yeARR) + '</b></div>' +
      '<div class="scen-out"><span>Gap to target</span>' + deltaSpan(x.r.yeARR - L.targetARR, {fmt:fK}) + '</div>' +
      '<div class="scen-out"><span>FY plan revenue</span><b class="num">' + fK(x.r.fyPlanRevenue) + '</b></div>' +
      '<button class="apply-btn" data-scen="' + i + '">Apply to levers</button></div>';
  }).join('');
  document.querySelectorAll('#scen-cards .apply-btn').forEach(btn => btn.addEventListener('click', () => {
    state.levers = Object.assign({}, scen[+btn.dataset.scen].lv); syncInputs(); renderPlanner();
  }));
}

const PCT_LEVERS = ['growth','dropout','churn','gm'];
function syncInputs(){
  Object.keys(state.levers).forEach(k => { const el = document.getElementById('lv-' + k); if (el) el.value = PCT_LEVERS.includes(k) ? Math.round(state.levers[k]*1000)/10 : state.levers[k]; });
}
function bindInputs(){
  ['growth','newClients','arpa','dropout','churn','cac','gm','targetARR'].forEach(k => {
    const el = document.getElementById('lv-' + k); if (!el) return;
    el.addEventListener('input', () => { const raw = parseFloat(el.value); if (isNaN(raw)) return; state.levers[k] = PCT_LEVERS.includes(k) ? raw/100 : raw; renderPlanner(); });
  });
  const rs = document.getElementById('btn-reset');
  if (rs) rs.addEventListener('click', () => { state.levers = Object.assign({}, DATA.defaults); syncInputs(); renderPlanner(); });
}

/* ============================================================
   RENDER — ROAS ladder (live)
   ============================================================ */
const ST_CLASS = { 'Active':'st-active', 'Scaling':'st-scaling', 'Low spend':'st-low', 'Watch':'st-watch', 'Too early':'st-early', 'At risk':'st-risk', 'Inactive':'st-inactive' };
const AV_COLORS = ['#4F46E5','#0E9F6E','#C77A0F','#2563EB','#DB2777','#7C3AED','#0891B2','#CA8A04','#DC2626','#059669','#6366F1','#B45309'];
const avatar = name => { let h=0; for (let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0; const initials = name.replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''); return '<span class="avatar" style="background:'+AV_COLORS[h%AV_COLORS.length]+'">'+initials+'</span>'; };
const tierOf = v => v>=4500?5 : v>=3600?4 : v>=2700?3 : v>=1800?2 : 1;

function renderLadder(){
  if (!LADDER || !LADDER.src) return;
  const built = buildLadder(LADDER.src.recvRows, LADDER.src.trackerRows, state.manualDropped);
  LADDER.built = built;
  const rows = built.rows.slice();
  if (state.ladderSort === 'level') rows.sort((a,b)=> (b.level-a.level) || (b.arpa-a.arpa)); else rows.sort((a,b)=> b.arpa-a.arpa);
  document.getElementById('k-fleet-arpa').textContent = fmtMoney(built.fleetARPA);
  document.getElementById('k-fleet-note').textContent = 'across ' + built.counts.brands + ' qualifying brands · as of ' + built.today.toISOString().slice(0,10);
  document.getElementById('k-brands').textContent = built.counts.brands;
  document.getElementById('k-brands-note').textContent = 'with ≥1 paid ROAS invoice (or on the include list)';
  document.getElementById('k-l3').textContent = built.rows.filter(r=>r.level>=3 && !r.dropped).length;
  document.getElementById('k-dropped').textContent = built.counts.dropped;
  document.getElementById('k-dropped-note').textContent = built.rows.filter(r=>r.droppedBy==='tracker').length + ' churned in tracker · ' + built.rows.filter(r=>r.droppedBy==='manual').length + ' marked here';
  const warn = document.getElementById('ladder-warn');
  const warns = [];
  if (LADDER.src.trackerError) warns.push(LADDER.src.trackerError);
  if (built.unmatchedChurn.length) warns.push('Churn match warning: ' + built.unmatchedChurn.join(', ') + ' — churned in the tracker but no matching brand found in receivables, so NOT auto-dropped. Check the spelling in both sheets.');
  warn.style.display = warns.length ? 'block' : 'none'; warn.innerHTML = warns.join('<br>');
  const counts = {}; built.rows.forEach(r => { counts[r.status] = (counts[r.status]||0)+1; });
  const order = ['Active','Scaling','Watch','Low spend','Too early','At risk','Inactive'];
  document.getElementById('roas-chips').innerHTML = order.filter(k=>counts[k]).map(k => '<span class="st '+ST_CLASS[k]+'" style="font-size:12px; padding:5px 12px 5px 10px"><span class="dot"></span>'+k+' · '+counts[k]+'</span>').join('');
  const mCols = built.months;
  let t = '<table class="ladder"><thead><tr><th class="txt">Client</th><th>Mo.</th><th>Level</th><th>1→2</th><th>2→3</th><th>3→4</th>' + mCols.map(m=>'<th>'+m.label+'</th>').join('') + '<th>Total</th><th>ARPA</th><th class="txt">Status</th><th></th></tr></thead><tbody>';
  const step = v => v==null ? '<span class="step none">–</span>' : '<span class="step">'+v+'mo</span>';
  rows.forEach(r => {
    t += '<tr' + (r.dropped ? ' class="dropped-row"' : '') + '>' +
      '<td class="txt"><div class="cwrap">'+avatar(r.brand)+'<div><div class="cname">'+r.brand+(r.onHold?' <span class="tag">on hold</span>':'')+'</div><div class="cstart">since '+r.since+'</div></div></div></td>' +
      '<td class="num">'+r.moActive+'</td><td><span class="lvl lvl'+r.level+'">'+(r.level?'L'+r.level:'CPL')+'</span></td>' +
      '<td>'+step(r.ramp[0])+'</td><td>'+step(r.ramp[1])+'</td><td>'+step(r.ramp[2])+'</td>' +
      r.grid.map(v => v==null ? '<td class="spend-cell"></td>' : '<td class="spend-cell"><span class="schip t'+tierOf(v)+'">'+fNum(v)+'</span></td>').join('') +
      '<td class="num tot">'+fmtMoney(r.total)+'</td><td class="num arpa-big" title="'+r.basis+'">'+fmtMoney(r.arpa)+'</td>' +
      '<td class="txt"><span class="st '+ST_CLASS[r.status]+'"><span class="dot"></span>'+r.status+'</span>' + (r.dropped ? ' <span class="tag">dropped' + (r.droppedBy==='tracker'?' · tracker':'') + '</span>' : '') + '</td>' +
      '<td><button class="drop-btn" data-brand="'+r.brand.replace(/"/g,'&quot;')+'"' + (r.droppedBy==='tracker' ? ' disabled title="Churned in the ROAS tracker — change it there"' : '') + '>' + (r.dropped ? 'Undrop' : 'Drop') + '</button></td></tr>';
  });
  document.getElementById('tbl-roas').innerHTML = t + '</tbody></table>';
  document.querySelectorAll('#tbl-roas .drop-btn').forEach(b => b.addEventListener('click', () => {
    const name = b.dataset.brand, k = name.toLowerCase().replace(/[^a-z0-9]/g,'');
    const i = state.manualDropped.findIndex(x => x.toLowerCase().replace(/[^a-z0-9]/g,'') === k);
    if (i >= 0) state.manualDropped.splice(i,1); else state.manualDropped.push(name);
    saveManualDropped(state.manualDropped); renderLadder();
  }));
  document.querySelectorAll('#sort-toggle button').forEach(b => b.classList.toggle('on', b.dataset.sort === state.ladderSort));
  updateFooter();
}
function bindLadderControls(){
  document.querySelectorAll('#sort-toggle button').forEach(b => b.addEventListener('click', () => { state.ladderSort = b.dataset.sort; renderLadder(); }));
}

/* ============================================================
   METHOD
   ============================================================ */
function renderMethod(){
  const D = DATA;
  document.getElementById('method-body').innerHTML = `
    <h2>Sources — everything on this page is live</h2>
    <ul>
      <li><b>Model sheet</b> (three published tabs: Cockpit, Calculations, Top Clients) → Cockpit, Targets vs Actuals, Top Clients, Levers, and the CAC <b>targets</b>. Numbers are shown exactly as the sheet computes them.</li>
      <li><b>CAC sheet</b> (KM Tool expenses, Oct-25 onward) → CAC <b>actuals</b>: cost by category, monthly totals and acquisitions. If it can't be reached, the page falls back to the model sheet's CAC section and says so.</li>
      <li><b>Receivables sheet</b> + <b>ROAS tracker</b> → the ROAS Clients ladder. Recomputed from raw paid invoices on every load.</li>
      <li><b>Scenario Planner</b> → reads the sheet's inputs (2025 actuals, seasonality, signing schedule, lever defaults) and recomputes projections in your browser. It never writes back.</li>
    </ul>
    <h2>How the model builds revenue</h2>
    <ul>
      <li><b>Existing book:</b> each month of 2025 actual revenue grown by the existing-client growth assumption (currently ${fPct(D.defaults.growth)}). Full-year 2025 was ${fmtMoney(sum(D.prior2025))}.</li>
      <li><b>New clients:</b> the full-year signing count (${fNum(D.defaults.newClients)}) spread on a fixed ramp (1% in January rising to 14% in Nov/Dec). Revenue per client = plan ARPA shaped by that month's seasonality weight.</li>
      <li><b>Early dropout:</b> cohorts in their first three months are discounted by ${fPct(D.defaults.dropout)}; from month four they pay full seasonal ARPA.</li>
      <li><b>ARR:</b> de-seasonalised monthly revenue, averaged over a rolling three months. Latest month ARR ${fMshort(D.latestARR)} is the ${D.months[D.meta.latestClosedIdx-2]}–${D.months[D.meta.latestClosedIdx]} average run-rate.</li>
      <li><b>Unit economics:</b> LTV = ARPA × (1 − dropout) ÷ churn · Payback = CAC ÷ (ARPA × GM ÷ 12) · Customer-equivalent = ${fK(D.defaults.arpa)} of annual revenue.</li>
    </ul>
    <h2>ROAS ladder — the rules, applied literally</h2>
    <ul>
      <li>Only invoices with status exactly <b>Paid</b> count. Unconfirmed and cancelled never do. Level = highest paid milestone; brands with no ROAS milestone are excluded unless on the include list (Jetour, a CPL client).</li>
      <li>Net value per invoice = $ amount (or AED ÷ 3.6725), less 5% VAT where the invoice is VAT-included, less any refund.</li>
      <li><b>ARPA:</b> M1–M2 = ROAS spend to date. M3+ = latest <b>paid</b> invoice × 12. Dropped (churned in the tracker, or marked here) = total paid to date at any level. Fleet ARPA = simple average across qualifying brands.</li>
      <li><b>Grid and timing</b> use payment date: a May invoice paid in July sits in July. "Since" = first payment month. Months active counts the start month (a brand first paid in Dec is 1 month active in Dec).</li>
      <li><b>Status</b> replicates the tracking sheet's formula. Idle months = months since the last month with paid spend (the current month counts as 1). In order: ≤1 month active → Too early · idle ≥6 → Inactive · idle ≥ level and active >2 → At risk · idle ≥ level−1 → Watch · stepped up recently (months at level ≤ level−2, below L5) → Scaling · ARPA ≥ $24,000 → Active · else Low spend. Dropped brands always show Inactive.</li>
      <li>The tracker's <b>On Hold</b> is not churn — those brands stay in ARPA and are tagged "on hold". A brand churned in the tracker cannot be un-dropped here; change it in the tracker.</li>
      <li>Manual Drop/Undrop marks are saved in this browser only (they are not shared and don't write to any sheet).</li>
    </ul>
    <h2>Basis notes</h2>
    <ul>
      <li><b>CAC basis:</b> monthly CAC = that month's USD cost ÷ acquisitions (matches the CAC sheet's own per-month row); a month with spend but no acquisitions shows "n/a". Headline CAC = blended 2026 YTD (cost ÷ acquisitions, January to the latest closed month). Variance = model target − actual, so a positive (green) figure means under target. Category cells are converted from AED at 3.6725. The CAC sheet also carries Oct–Dec 2025, which sit outside the 2026 model year and are not shown. Its "Total/Avg" summary cells do not reconcile to its monthly figures under any basis, so they are not displayed.</li>
      <li>The model sheet's own CAC section differs from the CAC sheet for Jan–Apr merchant costs and for creator counts; the CAC sheet is the designated source of actuals.</li>
      <li>Existing-book share can exceed 100% in months where the existing/total split is computed independently in the sheet; it is shown as recorded.</li>
      <li><b>Scenario Planner precision:</b> a published CSV carries cell values only as displayed. The sheet's seasonality row is formatted to two decimals, which is its full precision, so the planner reads it exactly and reproduces the sheet's plan (the source and calibration are shown on the planner; if that row's format were ever reduced, the planner falls back to back-solving seasonality from the new-client revenue row).</li>
    </ul>
    <div class="footer-note">Live dashboard · model as of ${D.meta.asOf} · no numbers are stored in this file — every load re-reads the sheets.</div>`;
}

/* ---------- footer self-check ---------- */
function updateFooter(){
  const f = document.getElementById('side-foot'); if (!f) return;
  const parts = [];
  if (DATA) parts.push('Model · as of <b>' + DATA.meta.asOf + '</b>' + (DATA.cac && DATA.cac.source==='cac-sheet' ? ' · CAC sheet <b>live</b>' : ' · <b style="color:var(--warn)">CAC fallback</b>')); else parts.push('<b style="color:var(--bad)">Model failed to load</b>');
  if (LADDER && LADDER.built) parts.push('Ladder · <b>' + LADDER.built.counts.brands + ' brands</b> · ' + LADDER.built.today.toISOString().slice(0,10)); else if (LADDER && LADDER.error) parts.push('<b style="color:var(--bad)">Ladder failed to load</b>');

}

/* ============================================================
   BOOT — fetch everything, then render
   ============================================================ */
async function boot(){
  setChartDefaults(); buildPages(); bindNav(); bindLadderControls();
  state.manualDropped = loadManualDropped();
  const banner = document.getElementById('load-banner');
  const [modelRes, ladderRes, cacRes] = await Promise.allSettled([ loadLiveData(), fetchLadderSources(), fetchCacSheet(2026) ]);

  if (modelRes.status === 'fulfilled'){
    DATA = modelRes.value; window.__data = DATA;
    // CAC: actuals from the CAC sheet (targets stay from the model); fall back to the model's CAC section if it failed
    if (cacRes.status === 'fulfilled'){
      const live = cacRes.value;
      DATA.cac = { source:'cac-sheet', asOf: live.asOf,
        merchant: Object.assign({}, live.merchant, { target: DATA.cac.merchant.target, fy: DATA.cac.merchant.fy }),
        creator:  Object.assign({}, live.creator,  { target: DATA.cac.creator.target,  fy: DATA.cac.creator.fy }) };
    } else {
      DATA.cac.source = 'model-fallback'; DATA.cac.error = String(cacRes.reason && cacRes.reason.message || cacRes.reason);
    }
    state.levers = Object.assign({}, DATA.defaults);
    try { renderModel(); } catch(e){ showModelError('Model data loaded but a page failed to render: ' + e.message); console.error(e); }
    try { syncInputs(); bindInputs(); renderPlanner(); } catch(e){ console.error(e); }
  } else {
    showModelError('Could not load the model sheet (' + (modelRes.reason && modelRes.reason.message || modelRes.reason) + '). Check that the Cockpit, Calculations and Top Clients tabs are still published to the web as CSV. Nothing is cached in this file, so no stale numbers are shown.');
  }
  if (ladderRes.status === 'fulfilled'){
    LADDER = { src: ladderRes.value };
    try { renderLadder(); } catch(e){ showLadderError('Ladder data loaded but failed to render: ' + e.message); console.error(e); }
  } else {
    LADDER = { error: String(ladderRes.reason && ladderRes.reason.message || ladderRes.reason) };
    showLadderError('Could not load the receivables sheet (' + LADDER.error + '). The ladder is not shown rather than shown stale.');
  }
  banner.style.display = 'none';
  updateFooter();
  window.__ready = true;
  document.dispatchEvent(new Event('app-ready'));
}
function showModelError(msg){ const e = document.getElementById('model-error'); e.style.display = 'block'; e.innerHTML = '<b>Live data problem.</b> ' + msg; }
function showLadderError(msg){ const e = document.getElementById('ladder-error'); e.style.display = 'block'; e.innerHTML = '<b>Live data problem.</b> ' + msg; }

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
</body>
</html>
